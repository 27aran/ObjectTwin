[project]
name = "objecttwin"
version = "0.1.0"
description = "Find the image in a folder tree that looks most similar to a reference image (DINOv2)."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aran Moradi" }]
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "imagecodecs>=2024.6",
    "numpy>=1.26",
    "pillow>=10.4",
    "pyside6-essentials>=6.7",
    "tifffile>=2024.8",
    "transformers>=4.47",
]

# PyTorch comes in two mutually exclusive flavours (see [tool.uv.sources] below):
#   uv sync --extra cpu     -> CPU-only build (development, machines without NVIDIA GPU)
#   uv sync --extra cu126   -> CUDA 12.6 build (NVIDIA GPU, falls back to CPU automatically)
[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu126 = ["torch>=2.5"]

[project.urls]
Repository = "https://github.com/27aran/ObjectTwin"
Issues = "https://github.com/27aran/ObjectTwin/issues"
Changelog = "https://github.com/27aran/ObjectTwin/blob/main/CHANGELOG.md"

[project.gui-scripts]
objecttwin = "objecttwin.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objecttwin"]

# ---------------------------------------------------------------- PyTorch variants

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not model'"
markers = [
    "model: needs the real DINOv2 weights (downloads ~350 MB on first run); run with `-m model`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# User-facing texts intentionally use typographic characters (– × “ ”).
"src/objecttwin/gui/*" = ["RUF001"]
