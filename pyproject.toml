[project]
name = "objecttwin"
version = "0.1.0"
description = "Find the image in a folder tree that looks most similar to a reference image (DINOv2)."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "imagecodecs>=2024.6",
    "numpy>=1.26",
    "pillow>=10.4",
    "tifffile>=2024.8",
]

[project.gui-scripts]
objecttwin = "objecttwin.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objecttwin"]

# ---------------------------------------------------------------- tooling

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
